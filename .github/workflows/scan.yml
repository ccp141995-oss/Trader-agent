name: Trade Agent Scan

on:
  schedule:
    # Kept as a redundant backup only — GitHub's own schedule trigger has proven unreliable for
    # this repo (confirmed: stopped firing entirely for an extended period with no error, no
    # disabled banner, and no explanation found on the repo side). repository_dispatch below,
    # driven by an external cron service, is now the primary trigger.
    - cron: '7-59/15 * * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab
  repository_dispatch:
    types: [trigger-scan]   # fired by an external cron service hitting the GitHub API directly

permissions:
  contents: write   # needed so the workflow can commit updated state/recommendations
  actions: write    # needed to immediately dispatch the poller workflow when auto-trade is eligible

concurrency:
  group: jarvis-trade-agent-git
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Safety net: none of our HTTP calls (Hyperliquid, Anthropic) have explicit timeouts, so a
    # single hung network call could otherwise leave this job running for GitHub's default of up
    # to 6 hours before being forcibly killed. This forces a clean failure well before that.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          SCAN_MODE: ${{ vars.SCAN_MODE }}
          FILTERED_TOP_N: ${{ vars.FILTERED_TOP_N }}
          FILTERED_MIN_OI: ${{ vars.FILTERED_MIN_OI }}
          FILTERED_MIN_VOLUME_24H: ${{ vars.FILTERED_MIN_VOLUME_24H }}
          HL_NETWORK: ${{ vars.HL_NETWORK }}
          HL_EXEC_NETWORK: ${{ vars.HL_EXEC_NETWORK }}
          AUTO_SCAN_INTERVAL_MIN: ${{ vars.AUTO_SCAN_INTERVAL_MIN }}
          SIGNAL_SENSITIVITY: ${{ vars.SIGNAL_SENSITIVITY }}
          EXECUTION_WINDOW_MIN: ${{ vars.EXECUTION_WINDOW_MIN }}
          MAX_STOP_LOSS_PCT: ${{ vars.MAX_STOP_LOSS_PCT }}
          AI_RESEARCH_ENABLED: ${{ vars.AI_RESEARCH_ENABLED }}
          AUTO_TRADE_ENABLED: ${{ vars.AUTO_TRADE_ENABLED }}
          MAX_RECS_PER_SCAN: ${{ vars.MAX_RECS_PER_SCAN }}
          MAX_TAKE_PROFIT_PCT: ${{ vars.MAX_TAKE_PROFIT_PCT }}
          MAX_ENTRY_DEVIATION_PCT: ${{ vars.MAX_ENTRY_DEVIATION_PCT }}
        run: node agent/scan.js

      - name: Commit updated state and recommendations
        run: |
          git config user.name "jarvis-trade-agent"
          git config user.email "actions@github.com"
          git add agent/state.json docs/recommendations.json docs/charts/ docs/circuit_breaker.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Trade agent scan update"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase && git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed (likely racing with the Telegram poller workflow) -- retrying..."
            sleep $(( (RANDOM % 5) + 3 ))
          done
          git rebase --abort 2>/dev/null || true
          echo "Could not push after 5 attempts. The recommendation was already sent to Telegram if applicable; only the repo commit is delayed to the next run."
          exit 1

      - name: Immediately trigger the poller if auto-trade is eligible
        # Only runs after the push above completes, so the poller run this triggers is guaranteed
        # to see the freshly-committed recommendation rather than a stale checkout. This is what
        # actually makes auto-trade fast -- without it, the earliest execution could happen is
        # whenever the poller's own next scheduled run occurs (up to 5 min) plus however far into
        # its ~2.5-minute confirm/deny window that run already is. This cuts that down to roughly
        # however long a fresh GitHub Actions runner takes to start, typically well under a minute.
        run: |
          if [ -f auto_trade_pending.flag ]; then
            echo "Auto-trade-eligible recommendation found -- dispatching the poller workflow now."
            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/telegram-poll.yml/dispatches" \
              -d '{"ref":"${{ github.ref_name }}"}' \
              || echo "Could not dispatch the poller workflow immediately -- it will still run on its own schedule within a few minutes."
          else
            echo "No auto-trade-eligible recommendation this run -- nothing to dispatch immediately."
          fi

      - name: Notify on workflow failure
        if: failure()
        run: |
          cat > /tmp/failure_payload.json <<'PAYLOAD_EOF'
          {"chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}", "text": "Trade Agent Scan workflow failed on GitHub Actions (run ${{ github.run_id }}). Check the Actions tab for logs -- nothing was silently lost, but this run did not complete."}
          PAYLOAD_EOF
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            --data @/tmp/failure_payload.json \
            || echo "Could not send failure notification (bad token/chat id, or Telegram unreachable)."
