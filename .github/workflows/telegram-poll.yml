name: Trade Agent Telegram Poller

on:
  schedule:
    # Every 5 minutes — GitHub's practical minimum for reliable scheduling.
    # Each run itself long-polls Telegram for ~4 minutes, so real response time
    # is usually well under a minute while this workflow is "between" runs.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jarvis-trade-agent-git
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: agent
        run: npm install --omit=dev

      - name: Poll Telegram and execute confirmed trades
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HL_AGENT_PRIVATE_KEY: ${{ secrets.HL_AGENT_PRIVATE_KEY }}
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_EXEC_NETWORK: ${{ vars.HL_EXEC_NETWORK }}
          MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT }}
          MAX_LEVERAGE: ${{ vars.MAX_LEVERAGE }}
          DEFAULT_TAKE_PROFIT_PCT: ${{ vars.DEFAULT_TAKE_PROFIT_PCT }}
          MAX_STOP_LOSS_PCT: ${{ vars.MAX_STOP_LOSS_PCT }}
          MAX_TAKE_PROFIT_PCT: ${{ vars.MAX_TAKE_PROFIT_PCT }}
          MAX_ENTRY_DEVIATION_PCT: ${{ vars.MAX_ENTRY_DEVIATION_PCT }}
          EXECUTION_WINDOW_MIN: ${{ vars.EXECUTION_WINDOW_MIN }}
        run: node agent/poll_telegram.js

      - name: Commit updated feed and offset
        run: |
          git config user.name "jarvis-trade-agent"
          git config user.email "actions@github.com"
          git add docs/recommendations.json agent/telegram_offset.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Telegram poll update"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase && git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed (likely racing with the scanner workflow) — retrying..."
            sleep $(( (RANDOM % 5) + 3 ))
          done
          git rebase --abort 2>/dev/null || true
          echo "Could not push after 5 attempts. Nothing further to do this run; the next scheduled run will pick up from here."
          exit 1

      - name: Notify on workflow failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": \"⚠ Trade Agent Telegram Poller workflow failed on GitHub Actions (run ${{ github.run_id }}). This is likely why button taps stopped getting a response — check the Actions tab for logs.\"}" \
            || echo "Could not send failure notification (bad token/chat id, or Telegram unreachable)."
