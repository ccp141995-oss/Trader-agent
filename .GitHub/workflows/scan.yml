name: Trade Agent Scan

on:
  schedule:
    # Every 15 minutes. This is the "cheap check" cadence — the script's own
    # AUTO_SCAN_INTERVAL_MIN cooldown decides when a full (paid) research call fires.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit updated state/recommendations

concurrency:
  group: trade-agent-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          HL_NETWORK: ${{ vars.HL_NETWORK }}
          AUTO_SCAN_INTERVAL_MIN: ${{ vars.AUTO_SCAN_INTERVAL_MIN }}
          SIGNAL_SENSITIVITY: ${{ vars.SIGNAL_SENSITIVITY }}
          EXECUTION_WINDOW_MIN: ${{ vars.EXECUTION_WINDOW_MIN }}
        run: node agent/scan.js

      - name: Commit updated state and recommendations
        run: |
          git config user.name "jarvis-trade-agent"
          git config user.email "actions@github.com"
          git add agent/state.json docs/recommendations.json
          git diff --cached --quiet || git commit -m "Trade agent scan update"
          git pull --rebase
          git push
